# CI mínimo do kit (v0.5.2; instalador desde a v0.5.4): o que o README promete, verificado a cada push e PR.
#   kit           — rules → cursor/rules em dia e todo .mdc com frontmatter na linha 1 (mutante); hooks fail-closed
#                   (matriz); nenhum documento válido em artefato de
#                   exibição; validadores do tlc no estado documentado (smoke test contra mutantes).
#   enrichment-lab — gate do laboratório (tipos, lint, testes) e docs/generated/ em dia.
#   orders-sample  — restore bloqueado pelo lockfile, build, testes e a rampa por projeto (v0.5.4, #25 e #26).
# Sem segredos, sem escrita: permissions só de leitura.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: tech-leads-club/agent-skills
          ref: main
          path: .tlc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: rules → cursor/rules em dia; todo .mdc abre com o frontmatter
        run: python3 tools/build-cursor.py --check
      - name: mutante — .mdc com carimbo antes do frontmatter reprova
        run: python3 tools/build-cursor.py --selftest
      - name: hooks fail-closed (matriz Claude × Cursor)
        run: bash tools/test-hooks.sh
      - name: instalador (apply.sh em diretório temporário)
        run: bash tools/test-apply.sh
      - name: nenhum documento válido em artefato de exibição
        run: python3 tools/check-documentos.py
      - name: validadores do tlc no estado documentado
        run: bash tools/test-validadores.sh
        env:
          TLC_DIR: .tlc/packages/skills-catalog/skills/(development)/tlc-spec-driven/scripts
  enrichment-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/enrichment-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: samples/enrichment-lab/.nvmrc
          cache: npm
          cache-dependency-path: samples/enrichment-lab/package-lock.json
      - run: npm ci
      - name: gate (tsc + eslint + jest)
        run: npm run gate
      - name: docs/generated em dia
        run: npm run generate:check
  orders-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: samples/orders-sample/global.json
      - name: restore bloqueado, build, testes e rampa por projeto
        run: bash tools/test-dotnet.sh
